// ── PWA INSTALL HOOK ─────────────────────────────────────────────────────────
function usePWA() {
  const [deferredPrompt, setDeferredPrompt] = React.useState(null);
  const [isInstalled, setIsInstalled] = React.useState(false);
  const [isIOS, setIsIOS] = React.useState(false);

  React.useEffect(() => {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    setIsIOS(ios);
    setIsInstalled(standalone);

    const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    window.addEventListener('appinstalled', () => setIsInstalled(true));
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const install = async () => {
    if (!deferredPrompt) return false;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') setIsInstalled(true);
    setDeferredPrompt(null);
    return outcome === 'accepted';
  };

  return { canInstall: !!deferredPrompt, isInstalled, isIOS, install };
}

// ── FIREBASE HOOK ─────────────────────────────────────────────────────────────
function useFirebase() {
  const [ready, setReady] = React.useState(!!window.__firebaseReady);
  React.useEffect(() => {
    if (window.__firebaseReady) { setReady(true); return; }
    const h = () => setReady(true);
    window.addEventListener('firebaseReady', h);
    return () => window.removeEventListener('firebaseReady', h);
  }, []);
  return ready;
}

    const rA=parseInt(game.placarRealA), rB=parseInt(game.placarRealB);
    if (isNaN(gA)||isNaN(gB)||isNaN(rA)||isNaN(rB)) return null;
    if (gA===rA && gB===rB) return 5;
    const gW=gA>gB?'A':gA<gB?'B':'E', rW=rA>rB?'A':rA<rB?'B':'E';
    return gW===rW ? 3 : 0;

    unsubs.push(onSnapshot(collection(db(),'games'), snap => {
      const fsGames = snap.docs.map(d => ({ ...d.data() }));
      setGames(mergeGames(fsGames));

    unsubs.push(onSnapshot(collection(db(),'guesses'), snap => {
      setGuesses(snap.docs.map(d => ({ ...d.data() })));

                        <span className="bg-slate-700/50 px-2.5 py-1.5 rounded-lg text-sm text-slate-600 min-w-[36px] text-center">—</span>

                        {user.isAdmin && <span className="px-2 py-0.5 rounded text-[9px] font-black uppercase bg-purple-500/10 text-purple-400">Admin</span>}
                      </div>
                    </div>
                    <div className="flex gap-1.5 flex-wrap">
                      {user.phone && (
                        <a href={`https://wa.me/55${user.phone.replace(/\D/g,'')}`} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 bg-emerald-600/15 text-emerald-400 font-bold py-1.5 px-2.5 rounded-lg text-[11px] border border-emerald-500/10 hover:bg-emerald-600/25 transition-colors">
                          <MsgIc cls="w-3.5 h-3.5"/> WhatsApp
                        </a>
                      )}
                      <button onClick={()=>toggleUserActivation(user.email, user.active)} className={`flex items-center gap-1 py-1.5 px-2.5 rounded-lg font-bold text-[11px] transition-colors ${user.active?'bg-amber-500/10 text-amber-400 hover:bg-amber-500/20':'bg-emerald-500 text-slate-950 hover:bg-emerald-400'}`}>
                        {user.active?'Bloquear':'Ativar'}
                      </button>
                      <button onClick={()=>toggleAdmin(user.email, user.isAdmin)} className={`flex items-center gap-1 py-1.5 px-2.5 rounded-lg font-bold text-[11px] transition-colors ${user.isAdmin?'bg-purple-500/20 text-purple-400 hover:bg-purple-500/30':'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                        <ShieldIc cls="w-3.5 h-3.5"/> {user.isAdmin?'Remover admin':'Tornar admin'}
                      </button>
                      <button onClick={()=>setDeleteModal(user)} className="flex items-center gap-1 bg-red-500/10 text-red-400 hover:bg-red-500/20 py-1.5 px-2.5 rounded-lg font-bold text-[11px] transition-colors">
                        <TrashIc cls="w-3.5 h-3.5"/> Excluir

              </div>

                {INITIAL_GAMES.map(baseGame => {
                  const game = games.find(g => g.id===baseGame.id) || baseGame;
                  return (
                    <div key={game.id} className="bg-slate-900 p-3 rounded-xl flex items-center gap-2">
                      <div className="flex-1 min-w-0">
                        <p className="font-bold text-slate-200 text-xs truncate">{game.timeA} × {game.timeB}</p>
                        <p className="text-[10px] text-slate-600">{game.data}</p>
                      </div>
                      <div className="flex gap-1 shrink-0">
                        <input type="number" min="0" placeholder="-" value={game.placarRealA!==null?game.placarRealA:''} onChange={e=>handleUpdateRealScore(game.id, e.target.value, game.placarRealB!==null?String(game.placarRealB):'')} className="w-10 h-9 text-center bg-slate-800 border border-slate-700 rounded-lg text-white text-sm font-bold focus:outline-none focus:border-emerald-500 transition-colors"/>
                        <span className="self-center text-slate-600 text-xs">×</span>
                        <input type="number" min="0" placeholder="-" value={game.placarRealB!==null?game.placarRealB:''} onChange={e=>handleUpdateRealScore(game.id, game.placarRealA!==null?String(game.placarRealA):'', e.target.value)} className="w-10 h-9 text-center bg-slate-800 border border-slate-700 rounded-lg text-white text-sm font-bold focus:outline-none focus:border-emerald-500 transition-colors"/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}
      </main>

      {/* NAVBAR */}
      <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800/80 z-40 safe-area-pb">
        <div className="max-w-md mx-auto flex justify-around items-center py-2 px-2">
          {[
            { id:'jogos',    label:'Jogos',      icon:<Calendar cls="w-5 h-5"/> },
            { id:'ranking',  label:'Ranking',    icon:<Trophy cls="w-5 h-5"/> },
            { id:'resultados',label:'Resultados',icon:<ResultIc cls="w-5 h-5"/> },
            { id:'pagamento',label:'Pagamento',  icon:<QrCode cls="w-5 h-5"/> },
            ...(currentUser.isAdmin ? [{ id:'admin', label:'Admin', icon:<SettingsIc cls="w-5 h-5"/> }] : [])
          ].map(tab => (
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)} className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl transition-all active:scale-90 ${activeTab===tab.id?'text-emerald-400 bg-emerald-500/10':'text-slate-500 hover:text-slate-300'}`}>
              {tab.icon}
              <span className="text-[10px] font-bold">{tab.label}</span>
              {activeTab===tab.id && <span className="w-4 h-0.5 bg-emerald-400 rounded-full mt-0.5"/>}
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

// ── PAINEL PIX ADMIN ──────────────────────────────────────────────────────────
function PixAdminPanel({ pixConfig, onSave, showToast }) {
  const [form, setForm] = React.useState({ value:'', chave:'', qrImageUrl:'' });
  const [preview, setPreview] = React.useState('');
  const fileRef = React.useRef();

  React.useEffect(() => {
    setForm({ value: pixConfig.value||'', chave: pixConfig.chave||'', qrImageUrl: pixConfig.qrImageUrl||'' });
    setPreview(pixConfig.qrImageUrl||'');
  }, [pixConfig]);

  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 600*1024) { showToast('Imagem muito grande (máx 600KB).','error'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      setPreview(ev.target.result);
      setForm(f => ({ ...f, qrImageUrl: ev.target.result }));
    };
    reader.readAsDataURL(file);
  };

  return (
    <div className="bg-slate-800 rounded-2xl p-5 border border-slate-700">
      <h3 className="text-base font-bold text-yellow-400 flex items-center gap-2 mb-4"><CoinsIc cls="w-5 h-5"/> Configurar Pagamento</h3>
      <div className="space-y-3">
        <div>
          <label className="text-xs font-bold text-slate-400 uppercase block mb-1.5">Valor da Taxa (R$)</label>
          <input value={form.value} onChange={e=>setForm({...form,value:e.target.value})} placeholder="Ex: 20.00" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-yellow-500 transition-colors"/>
        </div>
        <div>
          <label className="text-xs font-bold text-slate-400 uppercase block mb-1.5">Chave Pix</label>
          <input value={form.chave} onChange={e=>setForm({...form,chave:e.target.value})} placeholder="CPF, e-mail, telefone ou chave aleatória" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-yellow-500 transition-colors"/>
        </div>
        <div>
          <label className="text-xs font-bold text-slate-400 uppercase block mb-2">Imagem do QR Code</label>
          {preview ? (
            <div>
              <div className="bg-white p-3 rounded-xl max-w-[180px]">
                <img src={preview} alt="QR Code" className="w-full rounded"/>
              </div>
              <button onClick={()=>{setPreview('');setForm(f=>({...f,qrImageUrl:''}));}} className="mt-2 text-xs text-red-400 hover:text-red-300 transition-colors">Remover imagem</button>
            </div>
          ) : (
            <button onClick={()=>fileRef.current.click()} className="flex items-center gap-2 bg-slate-900 border border-dashed border-slate-600 hover:border-yellow-500 text-slate-400 hover:text-yellow-400 px-4 py-4 rounded-xl text-sm transition-colors w-full justify-center">
              <ImageIc cls="w-5 h-5"/> Upload do QR Code
            </button>
          )}
          <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleImageUpload}/>
          <p className="text-[10px] text-slate-600 mt-1">Gere no seu banco, salve a imagem e envie aqui. Máx 600KB.</p>
        </div>
        <button onClick={()=>{ if(!form.value){showToast('Digite o valor.','error');return;} onSave(form); }} className="w-full bg-yellow-500 hover:bg-yellow-400 active:scale-95 text-slate-950 font-black py-3 rounded-xl text-sm transition-all flex items-center justify-center gap-2">
          <SaveIc cls="w-4 h-4"/> Salvar Configurações
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
